[project]
name = "dslm"
version = "0.1.0"
description = "Train, save, and query a domain-specific language model with the model's own chat template."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.46,<5",
  "peft>=0.13",
  "accelerate>=1.0",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dslm = "dslm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dslm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
