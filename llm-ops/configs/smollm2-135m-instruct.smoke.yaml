# Two optimizer steps, to prove the train/save path on CPU. Not a quality model.
model:
  name: HuggingFaceTB/SmolLM2-135M-Instruct
  torch_dtype: float32

data:
  train_file: data/sample/train.jsonl
  eval_file: data/sample/eval.jsonl
  max_length: 192

lora:
  r: 4
  alpha: 8
  dropout: 0.0
  target_modules: all-linear

train:
  output_dir: runs/smollm2-harborline-smoke
  num_train_epochs: 1
  max_steps: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  warmup_ratio: 0.0
  logging_steps: 1
  save_strategy: "no"
  eval_strategy: "no"
  seed: 7

query:
  max_new_tokens: 48
  temperature: 0.0
  top_p: 1.0
  system_prompt: >-
    You are Harborline, the policy assistant for Harborline Logistics.
    Answer only from Harborline policy. If a rule is not in the policy, say so.
