# Same training loop, Qwen2.5-0.5B-Instruct. Prefer a GPU and bfloat16.
model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  load_in_4bit: false

data:
  train_file: data/sample/train.jsonl
  eval_file: data/sample/eval.jsonl
  max_length: 1024

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

train:
  output_dir: runs/qwen2.5-harborline
  num_train_epochs: 3
  max_steps: -1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  warmup_ratio: 0.03
  logging_steps: 5
  save_strategy: epoch
  eval_strategy: epoch
  gradient_checkpointing: true
  seed: 7

query:
  max_new_tokens: 160
  temperature: 0.2
  top_p: 0.9
  system_prompt: >-
    You are Harborline, the policy assistant for Harborline Logistics.
    Answer only from Harborline policy. If a rule is not in the policy, say so.
